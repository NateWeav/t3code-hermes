name: Mobile IPA

# Builds an UNSIGNED, sideloadable iOS .ipa of the production variant.
#
# There are no certificates or provisioning profiles here on purpose: AltStore
# and Sideloadly re-sign the payload with the installing Apple ID, so a signed
# build would only be stripped again. `app.config.ts` pins `appleTeamId`, but
# CODE_SIGNING_ALLOWED=NO makes xcodebuild ignore it.
#
# Runs on the self-hosted Apple Silicon runner (a laptop), which needs Xcode
# installed. No cron trigger: the machine is not always online, and GitHub's
# hosted macOS minutes bill at 10x on a private repo.

on:
  workflow_dispatch:
  release:
    types: [published, prereleased]

permissions:
  contents: write

concurrency:
  group: mobile-ipa-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: [self-hosted, macOS, ARM64, t3code-mac-arm64]
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
      # The runner's xcode-select points at the Command Line Tools, which have
      # no xcodebuild. Xcode also has to be license-accepted once by hand on
      # that machine: sudo xcodebuild -license accept
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The runner service is launched without a login shell, so Homebrew is
      # not on PATH — and neither are jq or gh, which the steps below shell out
      # to.
      - name: Put Homebrew on PATH
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"

      # Vite+'s downloaded CLI is ad-hoc signed, which macOS can reject for a
      # non-interactive self-hosted runner before the CLI gets a chance to
      # install Node or dependencies. This workflow only needs Node and pnpm,
      # so use their upstream bootstrap path directly.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          corepack enable
          corepack prepare "pnpm@$pnpm_version" --activate
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter=@t3tools/mobile... \
            --filter=@t3tools/scripts...

      - name: Show toolchain
        run: xcodebuild -version

      - id: version
        name: Resolve app version
        working-directory: apps/mobile
        shell: bash
        run: |
          set -uo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [[ -n "$tag" ]]; then
            version="${tag#v}"
          else
            version="$(pnpm exec expo config --type public --json | jq -r '.version // empty')"
          fi
          if [[ -z "$version" ]]; then
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building T3Code-$version.ipa"

      - name: Prebuild iOS project
        working-directory: apps/mobile
        # Managed Expo app: there is no checked-in ios/ directory, so the Xcode
        # project (and its Podfile install) is generated here. Pods install as
        # part of prebuild.
        run: pnpm exec expo prebuild --clean --platform ios

      - id: xcode
        name: Resolve workspace and scheme
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"
          if [[ -z "$workspace" || -z "$project" ]]; then
            echo "Expo prebuild did not generate an iOS workspace and app project." >&2
            exit 1
          fi

          # CocoaPods and Swift packages expose dependency schemes in the
          # workspace, so the first non-Pods scheme may not be the app. Expo
          # gives the generated app project and its shared scheme the same name.
          scheme="$(basename "$project" .xcodeproj)"
          if ! xcodebuild -list -json -workspace "$workspace" \
            | jq -e --arg scheme "$scheme" '.workspace.schemes | index($scheme) != null' >/dev/null; then
            echo "Expected app scheme '$scheme' was not found in $workspace." >&2
            exit 1
          fi
          echo "workspace=apps/mobile/$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Workspace: $workspace, scheme: $scheme"

      - name: Build unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ipa-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - id: package
        name: Package Payload into an IPA
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/ipa-build/Build/Products/Release-iphoneos"
          app="$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was produced in $products:" >&2
            find "$products" -maxdepth 2 -mindepth 1 -print >&2
            exit 1
          fi
          echo "Packaging $app"

          staging="$RUNNER_TEMP/ipa-stage"
          rm -rf "$staging"
          mkdir -p "$staging/Payload"
          cp -R "$app" "$staging/Payload/"

          ipa_name="T3Code-$VERSION.ipa"
          ipa_path="$RUNNER_TEMP/$ipa_name"
          rm -f "$ipa_path"
          (cd "$staging" && zip -qry "$ipa_path" Payload)

          echo "ipa_name=$ipa_name" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          ls -lh "$ipa_path"
          {
            echo "## Unsigned IPA"
            echo
            echo "- \`$ipa_name\` ($(du -h "$ipa_path" | cut -f1))"
            echo "- Sideload with AltStore or Sideloadly; both re-sign on install."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.ipa_path }}" --clobber
