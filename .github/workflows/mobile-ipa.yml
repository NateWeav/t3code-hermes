name: Mobile IPA

# Builds an UNSIGNED, sideloadable iOS .ipa of the production variant.
#
# There are no certificates or provisioning profiles here on purpose: AltStore
# and Sideloadly re-sign the payload with the installing Apple ID, so a signed
# build would only be stripped again. `app.config.ts` pins `appleTeamId`, but
# CODE_SIGNING_ALLOWED=NO makes xcodebuild ignore it.
#
# Uses a standard GitHub-hosted Apple Silicon runner so builds do not wait
# for a laptop to come online. Standard hosted runners are free for public repos.
# It needs Xcode 27.1 or newer: the iPhone Duo's vertical-bar layout
# (T3LayoutMetricsView.swift) compiles only against the iOS 27.1 SDK, and
# macos-26 images stop at Xcode 26.6. 27.1 matches eas.json's build image.
#
# release.yml calls this for each nightly and stable release with the release
# commit and version, alongside its tests, and attaches the artifact once the
# release is published. Releases it publishes with GITHUB_TOKEN never fire the
# `release` trigger below. Tagged builds attach the IPA to the release and
# refresh the Feather source (mobile-ipa-source.yml).

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
      ref:
        description: "Commit to build when there is no tag yet"
        required: false
        type: string
      version:
        description: "Version for the artifact name when there is no tag yet"
        required: false
        type: string
    outputs:
      bundle_id:
        value: ${{ jobs.ipa.outputs.bundle_id }}
      app_name:
        value: ${{ jobs.ipa.outputs.app_name }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (blank builds the selected ref as a workflow artifact)"
        required: false
        type: string
  release:
    types: [published, prereleased]

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: mobile-ipa-${{ inputs.tag || github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      tag: ${{ env.TAG }}
      bundle_id: ${{ steps.package.outputs.bundle_id }}
      app_name: ${{ steps.package.outputs.app_name }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || env.TAG || github.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Install scripts must run: react-native-enriched-markdown's postinstall
      # downloads RaTeX and the tree-sitter grammars. Without them pod install
      # fails (the app enables math) and code highlighting compiles out.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile \
            --filter=@t3tools/mobile... \
            --filter=@t3tools/scripts...

      # The postinstall only warns when a download fails, so check the stamps
      # it writes on success and retry it once.
      - name: Check vendored markdown assets
        working-directory: apps/mobile/node_modules/react-native-enriched-markdown
        shell: bash
        run: |
          stamps=(cpp/highlight/vendor/grammars/.stamp ios/vendor/.stamp)
          complete() { for stamp in "${stamps[@]}"; do [[ -f "$stamp" ]] || return 1; done; }
          complete || INIT_CWD="$GITHUB_WORKSPACE" node postinstall.mjs
          complete || { echo "::error::react-native-enriched-markdown assets are still missing: ${stamps[*]}"; exit 1; }

      - name: Show toolchain
        run: xcodebuild -version

      - id: version
        name: Resolve app version
        working-directory: apps/mobile
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -uo pipefail
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
          elif [[ -n "$VERSION_INPUT" ]]; then
            version="$VERSION_INPUT"
          else
            version="$(pnpm exec expo config --type public --json | jq -r '.version // empty')"
          fi
          if [[ -z "$version" ]]; then
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building T3Code-$version.ipa"

      - name: Prebuild iOS project
        working-directory: apps/mobile
        # Managed Expo app: there is no checked-in ios/ directory, so the Xcode
        # project (and its Podfile install) is generated here. Pods install as
        # part of prebuild.
        run: pnpm exec expo prebuild --clean --platform ios

      - id: xcode
        name: Resolve workspace and scheme
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"
          if [[ -z "$workspace" || -z "$project" ]]; then
            echo "Expo prebuild did not generate an iOS workspace and app project." >&2
            exit 1
          fi

          # CocoaPods and Swift packages expose dependency schemes in the
          # workspace, so the first non-Pods scheme may not be the app. Expo
          # gives the generated app project and its shared scheme the same name.
          scheme="$(basename "$project" .xcodeproj)"
          if ! xcodebuild -list -json -workspace "$workspace" \
            | jq -e --arg scheme "$scheme" '.workspace.schemes | index($scheme) != null' >/dev/null; then
            echo "Expected app scheme '$scheme' was not found in $workspace." >&2
            exit 1
          fi
          echo "workspace=apps/mobile/$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Workspace: $workspace, scheme: $scheme"

      - name: Build unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ipa-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - id: package
        name: Package Payload into an IPA
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/ipa-build/Build/Products/Release-iphoneos"
          app="$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was produced in $products:" >&2
            find "$products" -maxdepth 2 -mindepth 1 -print >&2
            exit 1
          fi
          echo "Packaging $app"
          plist="$app/Info.plist"
          echo "bundle_id=$(plutil -extract CFBundleIdentifier raw "$plist")" >> "$GITHUB_OUTPUT"
          echo "app_name=$(plutil -extract CFBundleDisplayName raw "$plist" 2>/dev/null || plutil -extract CFBundleName raw "$plist")" >> "$GITHUB_OUTPUT"

          staging="$RUNNER_TEMP/ipa-stage"
          rm -rf "$staging"
          mkdir -p "$staging/Payload"
          cp -R "$app" "$staging/Payload/"

          ipa_name="T3Code-$VERSION.ipa"
          ipa_path="$RUNNER_TEMP/$ipa_name"
          rm -f "$ipa_path"
          (cd "$staging" && zip -qry "$ipa_path" Payload)

          echo "ipa_name=$ipa_name" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"
          ls -lh "$ipa_path"
          {
            echo "## Unsigned IPA"
            echo
            echo "- \`$ipa_name\` ($(du -h "$ipa_path" | cut -f1))"
            echo "- Sideload with Feather, AltStore, or Sideloadly; all re-sign on install."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to release
        if: env.TAG != ''
        run: gh release upload "$TAG" "${{ steps.package.outputs.ipa_path }}" --clobber

  source:
    name: Publish IPA source
    needs: ipa
    if: needs.ipa.outputs.tag != ''
    uses: ./.github/workflows/mobile-ipa-source.yml
    with:
      tag: ${{ needs.ipa.outputs.tag }}
      bundle_id: ${{ needs.ipa.outputs.bundle_id }}
      app_name: ${{ needs.ipa.outputs.app_name }}
